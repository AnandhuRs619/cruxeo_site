<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="c_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Monogram Glyph -->
  <g transform="translate(6, 5)">
    <!-- Outer hexagonal or dynamic curved ring for Cruxeo C -->
    <path d="M 30 5 C 16 5, 5 16, 5 30 C 5 44, 16 55, 30 55 C 38 55, 45 51, 50 45" 
          stroke="url(#c_grad)" stroke-width="6" stroke-linecap="round" fill="none" transform="scale(0.65)" filter="url(#glow)" />
    <!-- Inner orbital core dot -->
    <circle cx="19.5" cy="19.5" r="4.5" fill="#38BDF8" />
    <circle cx="27" cy="12" r="2" fill="#FFFFFF" opacity="0.9" />
  </g>
  <!-- Wordmark -->
  <text x="56" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">CRUXEO</text>
  <circle cx="188" cy="30" r="3" fill="#2563EB" />
</svg>

