<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="kiosk_glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="70%" stop-color="#050914" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="screen_pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#kiosk_glow)" />

  <!-- Gesture ripples radiating outwards -->
  <circle cx="400" cy="230" r="140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" opacity="0.25" />
  <circle cx="400" cy="230" r="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.15" />
  <circle cx="400" cy="230" r="220" stroke="#38bdf8" stroke-width="0.75" opacity="0.1" />

  <!-- Monolith Kiosk Body -->
  <polygon points="340,90 460,90 490,440 310,440" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />
  <!-- Screen Area -->
  <polygon points="350,110 450,110 470,360 330,360" fill="#030712" stroke="#3b82f6" stroke-width="1.5" />

  <!-- Interactive Content on Screen -->
  <!-- 3D Geometric crystal interactive model -->
  <polygon points="400,160 435,210 400,270 365,210" fill="none" stroke="url(#screen_pulse)" stroke-width="2" />
  <polygon points="400,160 415,210 400,270 385,210" fill="none" stroke="#38bdf8" stroke-width="1" />
  <line x1="365" y1="210" x2="435" y2="210" stroke="#8b5cf6" stroke-width="1.5" />

  <!-- Floating Hand Motion Sensor Beacon -->
  <!-- Hand silhouette with radar tracking dots -->
  <circle cx="470" cy="240" r="16" fill="#38bdf8" fill-opacity="0.2" />
  <circle cx="470" cy="240" r="5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)" />
  <path d="M 470 240 L 415 210" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Floor stand base -->
  <ellipse cx="400" cy="440" rx="120" ry="16" fill="#070a13" stroke="#334155" stroke-width="1.5" />
  <ellipse cx="400" cy="440" rx="90" ry="10" fill="#030712" stroke="#38bdf8" stroke-width="1" opacity="0.5" />

  <!-- Label tag overlay -->
  <rect x="30" y="30" width="100" height="28" rx="14" fill="#030712" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1" />
  <text x="80" y="48" font-family="sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">SYNAPSE</text>
</svg>

