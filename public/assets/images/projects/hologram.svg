<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="holo_base_glow" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="holo_beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#030712" />
  <rect width="800" height="500" fill="url(#holo_base_glow)" />

  <!-- Holographic Projector Pedestal -->
  <ellipse cx="400" cy="400" rx="160" ry="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <ellipse cx="400" cy="395" rx="120" ry="20" fill="#030712" stroke="#60a5fa" stroke-width="1.5" />
  <ellipse cx="400" cy="390" rx="80" ry="12" fill="#0284c7" filter="drop-shadow(0 0 15px #38bdf8)" />

  <!-- Hologram Light Cone -->
  <polygon points="320,390 480,390 560,110 240,110" fill="url(#holo_beam)" opacity="0.45" />

  <!-- Floating Holographic Object (3D Earth & Orbital Network) -->
  <g transform="translate(400, 220)">
    <!-- Core Globe Wireframe -->
    <circle cx="0" cy="0" r="70" stroke="#38bdf8" stroke-width="1.5" fill="#0369a1" fill-opacity="0.1" filter="drop-shadow(0 0 10px #38bdf8)" />
    <!-- Latitude & Longitude rings -->
    <ellipse cx="0" cy="0" rx="70" ry="25" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="70" ry="50" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="25" ry="70" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
    <!-- Equator line -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#93c5fd" stroke-width="1.5" />

    <!-- Orbital Trajectory Rings -->
    <ellipse cx="0" cy="0" rx="110" ry="35" stroke="#818cf8" stroke-width="1.2" transform="rotate(-25)" opacity="0.75" />
    <circle cx="85" cy="-35" r="4.5" fill="#c084fc" filter="drop-shadow(0 0 8px #c084fc)" />
    <circle cx="-95" cy="30" r="3.5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)" />

    <!-- Digital Data Nodes -->
    <circle cx="20" cy="-30" r="3" fill="#ffffff" />
    <circle cx="-35" cy="20" r="2.5" fill="#ffffff" />
    <circle cx="45" cy="25" r="3" fill="#38bdf8" />
  </g>

  <!-- Scanlines across hologram -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.3">
    <line x1="240" y1="140" x2="560" y2="140" />
    <line x1="250" y1="180" x2="550" y2="180" />
    <line x1="260" y1="220" x2="540" y2="220" />
    <line x1="270" y1="260" x2="530" y2="260" />
    <line x1="280" y1="300" x2="520" y2="300" />
    <line x1="300" y1="340" x2="500" y2="340" />
  </g>

  <!-- Label tag overlay -->
  <rect x="30" y="30" width="115" height="28" rx="14" fill="#030712" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
  <text x="87" y="48" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">LUMEN LAB</text>
</svg>

