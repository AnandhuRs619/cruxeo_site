<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="sky_glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="drone_beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky_glow)" />
  <!-- City Skyline Silhouette -->
  <path d="M 0 500 L 0 420 L 40 420 L 40 380 L 70 380 L 70 440 L 110 440 L 110 350 L 130 310 L 150 350 L 150 450 L 220 450 L 220 370 L 250 370 L 250 440 L 320 440 L 320 330 L 360 330 L 380 260 L 400 330 L 440 330 L 440 450 L 520 450 L 520 390 L 560 390 L 560 440 L 630 440 L 630 360 L 670 360 L 670 450 L 730 450 L 730 400 L 770 400 L 770 450 L 800 450 L 800 500 Z" fill="#090d16" />
  
  <!-- Burj / Tower Needle Accent -->
  <line x1="380" y1="260" x2="380" y2="180" stroke="#1e293b" stroke-width="2" />
  <circle cx="380" cy="180" r="2" fill="#ef4444" />

  <!-- Drone Swarm Constellation (forming falcon / 3D helix) -->
  <g id="drone_swarm">
    <!-- Center glowing constellation -->
    <circle cx="400" cy="140" r="4" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)" />
    <circle cx="370" cy="120" r="3.5" fill="#60a5fa" filter="drop-shadow(0 0 5px #60a5fa)" />
    <circle cx="430" cy="120" r="3.5" fill="#60a5fa" filter="drop-shadow(0 0 5px #60a5fa)" />
    <circle cx="340" cy="100" r="3" fill="#93c5fd" filter="drop-shadow(0 0 5px #93c5fd)" />
    <circle cx="460" cy="100" r="3" fill="#93c5fd" filter="drop-shadow(0 0 5px #93c5fd)" />
    <circle cx="300" cy="90" r="3" fill="#38bdf8" filter="drop-shadow(0 0 4px #38bdf8)" />
    <circle cx="500" cy="90" r="3" fill="#38bdf8" filter="drop-shadow(0 0 4px #38bdf8)" />
    <circle cx="260" cy="110" r="2.5" fill="#818cf8" />
    <circle cx="540" cy="110" r="2.5" fill="#818cf8" />
    <circle cx="220" cy="140" r="2.5" fill="#c084fc" />
    <circle cx="580" cy="140" r="2.5" fill="#c084fc" />
    <!-- Center text/shape formed by drones -->
    <circle cx="370" cy="160" r="3" fill="#38bdf8" />
    <circle cx="430" cy="160" r="3" fill="#38bdf8" />
    <circle cx="390" cy="180" r="3.5" fill="#60a5fa" />
    <circle cx="410" cy="180" r="3.5" fill="#60a5fa" />
    <circle cx="400" cy="200" r="3" fill="#38bdf8" />
  </g>

  <!-- Constellation connective lines -->
  <path d="M 220 140 L 260 110 L 300 90 L 340 100 L 370 120 L 400 140 L 430 120 L 460 100 L 500 90 L 540 110 L 580 140" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 370 120 L 370 160 L 390 180 L 400 200 L 410 180 L 430 160 L 430 120" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Stars in sky -->
  <circle cx="120" cy="80" r="1" fill="#ffffff" opacity="0.8" />
  <circle cx="680" cy="60" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="720" cy="140" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="180" cy="190" r="1" fill="#ffffff" opacity="0.7" />
  
  <!-- Label tag overlay -->
  <rect x="30" y="30" width="130" height="28" rx="14" fill="#030712" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
  <text x="95" y="48" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">IGNISPECTRA</text>
</svg>

